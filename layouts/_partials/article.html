<div class="article-meta">
  <h1><span class="title">{{ .Title | markdownify }}</span></h1>
  {{ with .Params.author }}<h2 class="author">{{ . }}</h2>{{ end }}
  <h2 class="date">{{ .Date.Format "2006/01/02" }}</h2>
</div>

{{ if .Params.toc }}
<aside class="toc">
  <h4>目录</h4>
  {{ .TableOfContents }}
</aside>
{{ end }}

<main>
  {{ .Content }}
</main>
