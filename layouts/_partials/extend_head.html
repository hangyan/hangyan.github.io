<style>
    /* Typography: proper Chinese + Latin font stacks.
       PaperMod's default only sets a Latin stack; CJK falls back to the
       browser default, and code blocks have no font-family at all. */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei",
            "Noto Sans CJK SC", "Source Han Sans SC", Roboto, "Helvetica Neue",
            Arial, sans-serif;
    }
    code,
    kbd,
    pre,
    samp {
        font-family: "Cascadia Code", "SF Mono", "JetBrains Mono", Menlo, Consolas,
            "Liberation Mono", "Noto Sans Mono CJK SC", "Sarasa Mono SC", monospace;
    }
    /* inline code: default 0.78em is too small */
    .post-content code {
        font-size: 0.9em;
    }
    /* code blocks: inherit 18px body size by default, which is too big */
    .md-content pre code {
        font-size: 0.875em;
        line-height: 1.55;
    }
</style>
